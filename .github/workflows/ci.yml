name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
  library:
    uses: ./.github/workflows/test.yml
    with:
      commit: ${{ github.sha }}
