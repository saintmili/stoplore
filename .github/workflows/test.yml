name: Test library

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mtl_test
          POSTGRES_DB: mtl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mtl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MTL_TEST_POSTGRES_DSN: postgres://postgres:mtl_test@localhost:5432/mtl_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check module identity and dependencies
        run: |
          test "$(go list -m)" = github.com/saintmili/mtl
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Test CSV and PostgreSQL behaviors
        run: go test -count=1 ./...
